services:
  - type: web
    name: estoque-app
    runtime: docker
    plan: free
    region: oregon
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: estoque-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_NAME
        value: Administrador
      - key: ADMIN_EMAIL
        value: admin@estoque.local
      - key: ADMIN_PASSWORD
        sync: false
      - key: SERPAPI_KEY
        sync: false

databases:
  - name: estoque-db
    plan: free
    region: oregon
    databaseName: inventory
    user: inventory
